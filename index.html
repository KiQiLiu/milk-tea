<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>请我喝奶茶</title>
    <style>
        body {
            font-family: system-ui;
            padding: 30px;
            font-size: 22px;
        }
        #result {margin-top:20px;}
        input{
            font-size:20px;
            padding:8px;
            width:300px;
        }
        button {
            font-size:20px;
            padding:8px 16px;
            margin:5px;
        }
    </style>
</head>
<body>
    <div>问题：你愿意给我三十块让我喝杯奶茶吗？</div>
    <div id="result">在这里输入回答，点提交！（请填写：愿意 或者 不愿意）</div>

    <br>
    <input type="text" id="answerInput" placeholder="在这里输入回答">
    <button onclick="runGame()">提交答案</button>

<script>
// 标记：用户是否已经拒绝过一次
let hasRefused = false;

function runGame(){
    const userInput = document.getElementById("answerInput").value.trim();
    if (userInput === "愿意"){
        if(hasRefused){
            // 先拒绝，之后再选愿意
            document.getElementById("result").innerText = "穷人就是需要敲打的";
        }else{
            // 第一次就直接愿意
            document.getElementById("result").innerText = "谢谢妈咪！你是好人";
        }
    }else if(userInput === "不愿意"){
        if(hasRefused){
            // 第二次依旧不愿意
            document.getElementById("result").innerText = "没救了 纯纯穷人思维";
        }else{
            // 第一次不愿意，开启二次询问标记
            hasRefused = true;
            document.getElementById("result").innerText = "不要嘛 再考虑一下呗";
        }
    }else{
        document.getElementById("result").innerText = "❌只能输入【愿意】或者【不愿意】，请重新输入！";
    }
}
</script>
</body>
</html>
