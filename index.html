<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请我喝奶茶</title>
    <style>
        *{
            box-sizing: border-box;
            margin:0;
            padding:0;
            touch-action: manipulation; /* 消除手机点击延迟 */
        }
        body {
            font-family: system-ui, sans-serif;
            background-color: #fff7f7;
            min-height: 100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            padding:80px 20px;
            font-size: 22px;
        }
        .box{
            text-align:center;
            max-width:420px;
            width:100%;
        }
        #question{
            margin-bottom:24px;
        }
        #result {
            margin-bottom:24px;
            color:#c84868;
            font-weight:500;
        }
        input{
            font-size:20px;
            padding:10px 14px;
            width:100%;
            border: 1px solid #e2b1bc;
            border-radius:10px;
            outline:none;
            margin-bottom:12px;
        }
        input:focus{
            border-color:#d8788c;
        }
        button {
            font-size:20px;
            padding:10px 22px;
            border:none;
            border-radius:10px;
            background-color:#e8889c;
            color:white;
            cursor:pointer;
        }
        /* 手机触摸按下效果（手机没有hover） */
        button:active {
            background-color:#d46880;
        }
    </style>
</head>
<body>
    <div class="box">
        <div id="question">问题：你愿意给我三十块让我喝杯奶茶吗？</div>
        <div id="result">在这里输入回答，点提交！（请填写：愿意 或者 不愿意）</div>

        <input type="text" id="answerInput" placeholder="在这里输入回答">
        <button onclick="runGame()">提交答案</button>
    </div>

<script>
let hasRefused = false;

function runGame(){
    const userInput = document.getElementById("answerInput").value.trim();
    document.getElementById("answerInput").value = "";

    if (userInput === "愿意"){
        if(hasRefused){
            document.getElementById("result").innerText = "穷人就是需要敲打的 还算你有一丝觉悟";
        }else{
            document.getElementById("result").innerText = "谢谢妈咪！你是好人";
        }
    }else if(userInput === "不愿意"){
        if(hasRefused){
            document.getElementById("result").innerText = "没救了 纯纯穷人思维";
        }else{
            hasRefused = true;
            document.getElementById("result").innerText = "不要嘛 再考虑一下";
        }
    }else{
        document.getElementById("result").innerText = "❌只能输入【愿意】或者【不愿意】，请重新输入！";
    }
}
</script>
</body>
</html>
