<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>请我喝奶茶</title>
    <style>
        body {
            font-family: system-ui;
            padding: 30px;
            font-size: 22px;
        }
        #result {margin-top:20px;}
        input{
            font-size:20px;
            padding:8px;
            width:300px;
        }
        button {
            font-size:20px;
            padding:8px 16px;
            margin:5px;
        }
    </style>
</head>
<body>
    <div>问题：你愿意给我三十块让我喝杯奶茶吗？</div>
    <div id="result">在这里输入回答，点提交！（请填写：愿意 或者 不愿意）</div>

    <br>
    <input type="text" id="answerInput" placeholder="在这里输入回答">
    <button onclick="runGame()">提交答案</button>

<script>
function runGame(){
    const userInput = document.getElementById("answerInput").value;
    if (userInput === "愿意"){
        document.getElementById("result").innerText = "谢谢妈咪！";
    }else if(userInput === "不愿意"){
        document.getElementById("result").innerText = "要不要再考虑一下？";
    }else{
        // 输入既不是愿意、也不是不愿意，要求重新输入
        document.getElementById("result").innerText = "只能输入【愿意】或者【不愿意】，请重新输入！";
    }
}
</script>
</body>
</html>
