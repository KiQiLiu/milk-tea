<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>请我喝奶茶</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        body {
            font-family: system-ui;
            padding: 30px;
            font-size: 22px;
        }
        #result {margin-top:20px;}
        button {
            font-size:20px;
            padding:8px 16px;
            margin:5px;
        }
    </style>
</head>
<body>
    <div>问题：你愿意给我三十块让我喝杯奶茶吗？</div>
    <div id="result">正在加载Python环境，请稍候...</div>

    <script>
        async function main() {
            let pyodide = await loadPyodide();
            const code = `
answer = input("输入你的回答：")
if answer == "愿意":
    print("太棒啦！谢谢妈咪！")
else:
    print("我操你妈穷人思维")
`;
            document.getElementById("result").innerText = "加载完成！在下方输入回答";
            pyodide.runPython(code);
        }
        main();
    </script>
</body>
</html>
