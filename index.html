<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>请我喝奶茶</title>
    <style>
        body {
            font-family: system-ui;
            padding: 30px;
            font-size: 22px;
        }
        #result {margin-top:20px;}
        input{
            font-size:20px;
            padding:8px;
            width:300px;
        }
        button {
            font-size:20px;
            padding:8px 16px;
            margin:5px;
        }
    </style>
</head>
<body>
    <div>问题：你愿意给我三十块让我喝杯奶茶吗？</div>
    <div id="result">在这里输入回答，点提交！</div>

    <br>
    <input type="text" id="answerInput" placeholder="在这里输入回答">
    <button onclick="runGame()">提交答案</button>

<script>
function runGame(){
    const userInput = document.getElementById("answerInput").value;
    if (userInput == "愿意"){
        document.getElementById("result").innerText = "太好了！谢谢妈咪"
    }else{
        document.getElementById("result").innerText = "纯纯穷人思维"
    }
}
</script>
</body>
</html>
