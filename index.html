<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>请我喝奶茶</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        body {
            font-family: system-ui;
            padding: 30px;
            font-size: 22px;
        }
        #result {margin-top:20px;}
        input{
            font-size:20px;
            padding:8px;
            width:300px;
        }
        button {
            font-size:20px;
            padding:8px 16px;
            margin:5px;
        }
    </style>
</head>
<body>
    <div>问题：你愿意给我三十块让我喝杯奶茶吗？</div>
    <div id="result">正在加载Python环境，请稍候...</div>

    <br>
    <input type="text" id="answerInput" placeholder="在这里输入回答">
    <button onclick="runGame()">提交答案</button>

<script>
let pyodide;
async function loadPy(){
    pyodide = await loadPyodide();
    document.getElementById("result").innerText = "加载完成！在下方输入回答";
}
loadPy();

function runGame(){
    const userInput = document.getElementById("answerInput").value;
    const code = `
answer = "${userInput}"
if answer == "愿意":
    res = "爱你妈咪！"
else:
    res = "纯纯穷人思维"
`
    pyodide.runPython(code);
    let res = pyodide.globals.get("res");
    document.getElementById("result").innerText = res
}
</script>
</body>
</html>
