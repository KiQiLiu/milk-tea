<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>请我喝奶茶</title>
</head>
<body>
<h3>问题：你愿意给我三十块让我喝杯奶茶吗？</h3>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
<script>
async function runPython() {
  let pyodide = await loadPyodide();
  const code = `
print("问题：你愿意给我三十块让我喝杯奶茶吗？")
print("A：愿意")
print("B：不愿意")

choice = input("请输入你的选择（A/B）：")

if choice.upper() == "A":
    print("太好了！谢谢你妈咪")
elif choice.upper() == "B":
    print("臭穷人我重新给你一次思考的机会")
    again = input("再考虑一下吗？(A:愿意 / B:坚持不愿意)")
    if again.upper() == "A":
        print("哦妈咪谢谢你")
    elif again.upper() == "B":
        print("我操了阿帕兹了呀纯纯穷人思维")
    else:
        print("输入无效，默认你不愿意咯")
else:
    print("输入错误，请只能输入A或者B！")
`;
  await pyodide.runPythonAsync(code);
}
runPython();
</script>
</body>
</html>
