<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>请我喝奶茶</title>
    <style>
        *{
            box-sizing: border-box;
            margin:0;
            padding:0;
        }
        body {
            font-family: system-ui, sans-serif;
            background-color: #fff7f7;
            min-height: 100vh;
            /* 页面整体居中 */
            display:flex;
            flex-direction:column;
            align-items:center;
            padding-top:80px;
            font-size: 22px;
        }
        .box{
            text-align:center;
        }
        #question{
            margin-bottom:24px;
        }
        #result {
            margin-bottom:24px;
            color:#c84868;
            font-weight:500;
        }
        input{
            font-size:20px;
            padding:10px 14px;
            width:320px;
            border: 1px solid #e2b1bc;
            border-radius:10px;
            outline:none;
        }
        input:focus{
            border-color:#d8788c;
        }
        button {
            font-size:20px;
            padding:10px 22px;
            margin-left:8px;
            border:none;
            border-radius:10px;
            background-color:#e8889c;
            color:white;
            cursor:pointer;
        }
        /* 鼠标放上去按钮变深一点 */
        button:hover {
            background-color:#d46880;
        }
    </style>
</head>
<body>
    <div class="box">
        <div id="question">问题：你愿意给我三十块让我喝杯奶茶吗？</div>
        <div id="result">在这里输入回答，点提交！（请填写：愿意 或者 不愿意）</div>

        <input type="text" id="answerInput" placeholder="在这里输入回答">
        <button onclick="runGame()">提交答案</button>
    </div>

<script>
// 标记：用户是否已经拒绝过一次
let hasRefused = false;

function runGame(){
    // 第一步：先读取用户输入
    const userInput = document.getElementById("answerInput").value.trim();
    // 第二步：读取完成之后，清空输入框
    document.getElementById("answerInput").value = "";

    if (userInput === "愿意"){
        if(hasRefused){
            // 先拒绝，之后再选愿意
            document.getElementById("result").innerText = "穷人就是需要敲打的";
        }else{
            // 第一次就直接愿意
            document.getElementById("result").innerText = "谢谢妈咪！你是好人";
        }
    }else if(userInput === "不愿意"){
        if(hasRefused){
            // 第二次依旧不愿意
            document.getElementById("result").innerText = "没救了 纯纯穷人思维";
        }else{
            // 第一次不愿意，开启二次询问标记
            hasRefused = true;
            document.getElementById("result").innerText = "不要嘛 再考虑一下";
        }
    }else{
        document.getElementById("result").innerText = "❌只能输入【愿意】或者【不愿意】，请重新输入！";
    }
}
</script>
</body>
</html>
